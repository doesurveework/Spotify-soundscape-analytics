<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>soundscape.</title>


  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="app-container">


    <header class="header">
      <h1 class="logo">soundscape<span>.</span></h1>
      <div class="status-badge">
        <span id="status-dot" class="status-dot"></span>
        <span id="status-text">loading analytics...</span>
      </div>
    </header>


    <div id="empty-state" class="empty-state" hidden>
      <p id="empty-message">Something went wrong talking to Spotify.</p>
    </div>


    <main class="dashboard-content">


      <section class="card archetype-card">
        <h2 class="section-subtitle">YOUR LISTENING ARCHETYPE</h2>
        <h3 id="personality-type" class="archetype-title">—</h3>

        <div class="equalizer-container">
          <div class="eq-item">
            <div class="eq-bar" data-feature="energy"><span></span></div>
            <span class="eq-label">energy</span>
          </div>
          <div class="eq-item">
            <div class="eq-bar" data-feature="danceability"><span></span></div>
            <span class="eq-label">danceability</span>
          </div>
          <div class="eq-item">
            <div class="eq-bar" data-feature="valence"><span></span></div>
            <span class="eq-label">valence</span>
          </div>
        </div>
      </section>


      <section class="scores-grid">
        <div class="card score-card">
          <span class="score-label">OBSCURITY SCORE</span>
          <span id="obscurity-score" class="score-value">—</span>
          <span class="score-hint">100 = deep cuts only · 0 = mainstream chart-topper</span>
        </div>
        <div class="card score-card">
          <span class="score-label">AVG. ENERGY</span>
          <span id="avg-energy" class="score-value">—</span>
        </div>
        <div class="card score-card">
          <span class="score-label">AVG. DANCEABILITY</span>
          <span id="avg-dance" class="score-value">—</span>
        </div>
        <div class="card score-card">
          <span class="score-label">AVG. VALENCE</span>
          <span id="avg-valence" class="score-value">—</span>
        </div>
      </section>


      <section class="card chart-card">
        <h2 class="section-subtitle">TOP TRACKS · POPULARITY</h2>
        <div class="chart-wrapper">
          <canvas id="popularity-chart"></canvas>
        </div>
      </section>


      <section class="card tracklist-card">
        <h2 class="section-subtitle">YOUR TOP TRACKS</h2>
        <ul id="tracklist" class="track-list"></ul>
      </section>

    </main>
  </div>

  <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
</body>
</html>
